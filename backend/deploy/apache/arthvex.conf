# ARTHVEX Mail — Apache 2.4 reverse proxy template.
# Install as a NEW vhost file (e.g. /etc/apache2/sites-available/arthvex.conf).
# Do not overwrite an existing site. Replace every <PLACEHOLDER>.
#
# Required modules: proxy, proxy_http, headers, ssl, rewrite, deflate, http2 (optional).
# The API listens on loopback only; Stalwart's management listener must NOT be proxied here.

<VirtualHost *:80>
    ServerName <MAIL_DOMAIN>
    # ACME HTTP-01 can be served here if certbot uses webroot; otherwise redirect.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName <MAIL_DOMAIN>
    ServerAdmin <ADMIN_EMAIL>
    Protocols h2 http/1.1

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/<MAIL_DOMAIN>/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/<MAIL_DOMAIN>/privkey.pem
    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder     off

    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    # The SPA is served from this origin; tighten further if assets move to a CDN.
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Header always unset X-Powered-By

    DocumentRoot /srv/arthvex/frontend/dist
    <Directory /srv/arthvex/frontend/dist>
        Require all granted
        Options -Indexes
        # SPA history fallback (react-router).
        FallbackResource /index.html
    </Directory>

    # Cache immutable build assets, never the HTML shell.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <LocationMatch "^/(index\.html)?$">
        Header set Cache-Control "no-cache"
    </LocationMatch>

    # API reverse proxy.
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        /api/ http://127.0.0.1:4000/api/ retry=0 timeout=60
    ProxyPassReverse /api/ http://127.0.0.1:4000/api/

    # Forward the real client IP only if Apache is the edge; keep TRUST_PROXY=loopback in the app.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Attachment uploads pass through; keep this at least as large as WEBMAIL_MAX_ATTACHMENT_BYTES + slack.
    LimitRequestBody 20971520

    # Debian/Ubuntu define ${APACHE_LOG_DIR}. On Fedora/RHEL replace both with /var/log/httpd.
    ErrorLog  ${APACHE_LOG_DIR}/arthvex-error.log
    CustomLog ${APACHE_LOG_DIR}/arthvex-access.log combined
</VirtualHost>

# Explicitly refuse to proxy the mail-engine management listener or setup wizard.
<Location "/stalwart-management">
    Require all denied
</Location>
